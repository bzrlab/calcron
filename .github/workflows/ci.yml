name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      CALCRON_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Start Calcron for bot end-to-end test
        run: |
          go build -o calcron ./cmd/calcron
          DATABASE_URL=$CALCRON_TEST_DATABASE_URL CALCRON_ADMIN_TOKEN=e2e-admin PORT=18080 nohup ./calcron > calcron.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:18080/health && exit 0; sleep 1; done; cat calcron.log; exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: examples/bot
        env:
          CALCRON_E2E_URL: ws://localhost:18080/ws
          CALCRON_E2E_ADMIN_TOKEN: e2e-admin

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node
      - run: node scripts/check-sdk-docs.mjs
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
